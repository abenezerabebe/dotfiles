# leader
unbind C-b
set -g prefix C-s

# bindings
bind-key -r C-s send-prefix
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R
bind -n C-k clear-history

## Use vim keybindings in copy mode
setw -g mode-keys vi

## Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# sounds
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# windows
set-option -g allow-rename off

# panes
set -g pane-border-status top
set-window-option -g pane-border-format ' #{pane_title} '
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour9'

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour3 fg=colour0 bold'
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour0,bg=colour3,bold]#(tmux ls -F "##S" | grep -v "^#{session_name}$" | tr "\n" "│" | sed "s/│$//") │ CPU: #{cpu_icon} #{cpu_percentage}  │  %a %h-%d %H:%M  '
set -g status-right-length 120

setw -g window-status-style 'fg=colour0 bg=colour3 bold'
setw -g window-status-format '  #W  '
setw -g window-status-current-style 'fg=colour1 bg=colour3 bold'
setw -g window-status-current-format '  #W  '
setw -g window-status-bell-style 'fg=colour0 bg=colour1 bold'

#monorepo
set -g mouse on
setw -g mode-keys vi
set -g history-limit 200000

# messages
set -g message-style 'fg=colour232 bg=colour16 bold'

# ------------------------------
# Shell / environment consistency
# ------------------------------

# Ensure tmux uses zsh and loads login env (.zprofile → .zshenv.shared)
set -g default-shell /bin/zsh
set -g default-command "/bin/zsh -l"

# Sync key environment variables between host and tmux
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION PATH JAVA_HOME"

# ------------------------------
# Plugins
# ------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run -b '~/.tmux/plugins/tpm/tpm'
